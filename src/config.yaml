file_path: './data/classification_bonus_practice_data.csv'
target_column: Survive
random_seed: 42           # single seed used for splits and models
val_test_size: 0.2        # fraction of data held out for validation + test
val_size: 0.5             # fraction of the held-out data that becomes the TEST set (0.5 -> 80/10/10 split)
class_weight: balanced    # imbalance strategy for models that support it ('balanced' or null to disable)
class_labels: ['Did not survive', 'Survived']   # names for target values 0 and 1 in plots
artifacts_dir: './artifacts'      # each run saves its model, metrics, threshold, config snapshot and plots to a timestamped folder here (remove to disable)
log_file: './logs/pipeline.log'   # log file written alongside console logging (remove to disable)
# Optional business costs (e.g. cost of a missed survivor vs. cost of a false alarm).
# If both are set, the decision threshold minimises total cost on the validation set instead of maximising F1.
# cost_false_negative: 5
# cost_false_positive: 1
# NOTE: in YAML write a missing value as null (not None). A bare None is read as the text 'None' and breaks the grid search.
logreg_param_grid:
  classifier__C: [0.001, 0.01, 0.1, 1.0, 10, 100, 1000]
  classifier__penalty: ['l2', null]
knn_param_grid:
  classifier__n_neighbors: [3, 5, 7, 9, 11, 15]
  classifier__weights: ['uniform', 'distance'] 
dt_param_grid:
  classifier__max_depth: [3, 5, 7, 10, null]
  classifier__min_samples_split: [2, 5, 10]
  classifier__min_samples_leaf: [1, 2, 4]
cv: 5
scoring: roc_auc          # accuracy is misleading when the classes are imbalanced
numerical_features:
  - Age
  - Sodium
  - Creatinine
  - Platelets
  - Creatine phosphokinase
  - Blood Pressure
  - Hemoglobin
  - Height
  - Weight
nominal_features:
  - Smoke
  - Gender
ordinal_features:
  - Ejection Fraction
  - Diabetes
ejection_fraction_categories:
  - Low
  - Normal
  - High
diabetes_categories:
  - Normal
  - Pre-diabetes
  - Diabetes